spring:
  application:
    name: payment-processing-engine
  datasource:
    url: jdbc:postgresql://localhost:5432/payments
    username: payments
    password: payments
  jpa:
    hibernate:
      ddl-auto: update
    properties:
      hibernate:
        format_sql: true
    show-sql: false
  kafka:
    bootstrap-servers: localhost:9092
    consumer:
      group-id: payment-engine
      auto-offset-reset: latest
  data:
    redis:
      host: localhost
      port: 6379

server:
  port: 8080

security:
  jwt:
    issuer: payment-processing-engine
    audience: payment-processing-clients
    secret: change-me
    expiration-minutes: 60

idempotency:
  ttl-hours: 24

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics
